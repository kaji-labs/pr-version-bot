name: Dist integrity check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  check:
    name: Verify dist is up-to-date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist is committed
        run: |
          if ! git diff --quiet dist/; then
            echo "❌ dist/index.js is out of date."
            echo "   Run 'npm run build' locally and commit the result before opening a PR."
            git diff --stat dist/
            exit 1
          fi
          echo "✅ dist/index.js is up to date."
